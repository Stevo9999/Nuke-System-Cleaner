<script type="module">

let ctx, sirenGain, sirenOn = false;

function synthSiren(on, sec) {

  g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t + .15);

// real recordings in sounds/*.mp3; the synth above stands in for any that are missing
const files = {};
for (const n of ['siren', 'blast', 'spring', 'glass', 'press', 'flyover', 'whistle']) {

}
let fadeTimer;
function siren(on, sec) {
  if (on === sirenOn) return;

  if (!hasFile('siren')) return synthSiren(on, sec);
  const a = files.siren, target = on ? 0.75 : 0, steps = 30, dt = sec * 1000 / steps, from = a.volume;
  clearInterval(fadeTimer);
  if (on && a.paused) a.play().catch(() => { a.dataset.ok = '0'; synthSiren(on, sec); });
  let i = 0;
  fadeTimer = setInterval(() => {
    i++; a.volume = clamp(from + (target - from) * i / steps, 0, 1);
    if (i >= steps) { clearInterval(fadeTimer); if (!on) a.pause(); }
  }, dt);
}

/* ================= 3D scene ================= */

{

{

  fx.ringV = new THREE.Mesh(ringG, ringM); fx.ringV.position.copy(pc.centre); fx.objs.push(fx.ringV); scene.add(fx.ringV);
  // mushroom-ish smoke: a stem of spheres and a round cap, two shared materials, one shared geometry
  const smG = new THREE.SphereGeometry(1, 12, 8);
  const stemM = new THREE.MeshStandardMaterial({ color: 0x4a4540, roughness: 1, transparent: true, emissive: 0xff5a10, emissiveIntensity: 1.2, depthWrite: false });
  const capM = new THREE.MeshStandardMaterial({ color: 0x77706a, roughness: 1, transparent: true, emissive: 0xff7a20, emissiveIntensity: 1.2, depthWrite: false });
  fx.smoke = { stem: [], cap: [], stemM, capM };
  const smoke = new THREE.Group(); smoke.position.set(pc.centre.x, PC_FLOOR + 0.5, pc.centre.z); own(smoke, smG, stemM, capM);
  for (let i = 0; i < 5; i++) { const s = new THREE.Mesh(smG, stemM); smoke.add(s); fx.smoke.stem.push(s); }
  for (let i = 0; i < 9; i++) { const s = new THREE.Mesh(smG, capM); smoke.add(s); fx.smoke.cap.push(s); }

  scene.updateMatrixWorld(true);
  const throwIt = (m, big) => {
    const dir = m.getWorldPosition(new THREE.Vector3()).sub(pc.centre); dir.y = 0.2; if (dir.lengthSq() < 1e-4) dir.set(0, 0, 1); dir.normalize();
    const sp = big ? 7 + Math.random() * 8 : 10 + Math.random() * 14;
    pc.flying.push({ m, vel: new THREE.Vector3(dir.x * sp * 0.5, (big ? 22 : 18) + Math.random() * 16, dir.z * sp * 0.7 + 6 + Math.random() * 5),
      spin: new THREE.Vector3((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16), half: big ? 0.5 : 0.25, moving: true });
  };

    m.scale.set(k, k * (0.4 + Math.random()), k * (0.5 + Math.random() * 0.8)); m.position.copy(pc.centre); m.position.y += Math.random() * 2;
    m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3); scene.add(m); fx.objs.push(m); throwIt(m, false);

}
function pcDispose() {
  const fx = pc.fx; if (!fx) return;
  for (const o of fx.objs) scene.remove(o);
  for (const d of fx.disposables) d.dispose();   // loose shards share one geometry; the computer's own wreck stays where it landed

}
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
function pcUpdate(dt) {
  if (pc.state === 'idle' || pc.state === 'done') return;
  pc.t += dt;
  if (pc.state === 'warn') {                       // the screen blinks a red warning and the monitor shudders
    pc.screenMat.color.setScalar(Math.sin(pc.t * 40) > 0 ? 1 : 0.45);
    if (!pc.reduced) pc.group.position.set(PC_POS.x + (Math.random() - 0.5) * 0.18, PC_POS.y, PC_POS.z + (Math.random() - 0.5) * 0.18);
    if (pc.t >= pc.boomAt) { pc.group.position.copy(PC_POS); pcBoom(); }
    return;
  }
  const fx = pc.fx, u = pc.t - pc.boomT;
  if (fx) {
    fx.light.intensity = fx.peak * Math.exp(-u * 5);
    if (fx.reducedOnly) { if (u > 1) pcDispose(); return; }
    fx.core.scale.setScalar(1 + u * 14); fx.core.material.opacity = Math.max(0, 1 - u * 3.5); fx.core.visible = fx.core.material.opacity > 0;
    const rs = 1 + u * 22, ro = Math.max(0, 0.9 - u * 1.1);
    fx.ringH.scale.setScalar(rs); fx.ringV.scale.setScalar(rs); fx.ringH.material.opacity = ro; fx.ringH.visible = fx.ringV.visible = ro > 0;
    const sm = fx.smoke, k = u / 4.4, h = 2 + k * 11, rad = 1.2 + k * 4.5;
    const op = Math.min(1, u * 5) * (1 - sstep(0.6, 1, k)) * 0.85, glow = Math.max(0, 1.2 - u * 0.9);
    sm.stemM.opacity = sm.capM.opacity = op; sm.stemM.emissiveIntensity = sm.capM.emissiveIntensity = glow;
    sm.stem.forEach((s, i) => { s.position.set(Math.sin(i * 2.1) * 0.5, (i / 4) * h * 0.85, Math.cos(i * 2.1) * 0.5); s.scale.setScalar(1.1 + k * 1.2 + (1 - i / 4) * 0.5); });
    sm.cap.forEach((s, i) => {
      const a = (i / 8) * Math.PI * 2, top = i === 8;
      s.position.set(top ? 0 : Math.cos(a) * rad, h + (top ? 1.4 + k * 1.5 : Math.sin(i * 1.7) * 0.5), top ? 0 : Math.sin(a) * rad); s.scale.setScalar(1.7 + k * 2.2);

  }

    if (!f.moving) continue;

    m.rotation.x += f.spin.x * dt; m.rotation.y += f.spin.y * dt; m.rotation.z += f.spin.z * dt;
    const onDesk = Math.abs(m.position.x - PC_POS.x) <= PC_HX && Math.abs(m.position.z - PC_POS.z) <= PC_HZ;
    let s = onDesk ? PC_FLOOR : FLOOR_Y;
    if (!onDesk && py >= surfaceY(m.position.x, m.position.z) + f.half) s = surfaceY(m.position.x, m.position.z);   // lands on the table only when it arrives from above
    if (m.position.y < s + f.half) {
      m.position.y = s + f.half; f.vel.y *= -0.3; f.vel.x *= 0.55; f.vel.z *= 0.55; f.spin.multiplyScalar(0.5);
      if (f.vel.length() < 1.5) { f.moving = false; m.rotation.x = Math.round(m.rotation.x / (Math.PI / 2)) * Math.PI / 2; m.rotation.z = Math.round(m.rotation.z / (Math.PI / 2)) * Math.PI / 2; }
    }
    if (Math.abs(m.position.x) > ROOM_W / 2 - 1) { m.position.x = Math.sign(m.position.x) * (ROOM_W / 2 - 1); f.vel.x *= -0.3; }
    if (m.position.z > ROOM_FRONT - 1 || m.position.z < ROOM_BACK + 1) { m.position.z = clamp(m.position.z, ROOM_BACK + 1, ROOM_FRONT - 1); f.vel.z *= -0.3; }
  }

}

/* ================= press, blast ================= */
const cv ={ vel: new THREE.Vector3(), spin: new THREE.Vector3(), flying: false };
let pressAt = 0, shake = 0;
async function press() {
  if (stage !== 'unlocked') return;
  if (!canPress(serverState, glassAngle)) return toast('Lift the glass cover first');
  if (performance.now() - unlockedAt <= (info ? info.minGapMs : 2000) + 150) return toast('Wait a moment');
  stage = 'pressing';
  // Do not trust local state: the server must say 'unlocked' right now. One attempt per click, never retried automatically.
  let st = null; try { st = await getJson('state'); } catch (x) { /* handled below */ }
  if (!st || st.state !== 'unlocked') { if (stage === 'pressing') stage = 'unlocked'; return toast('Not pressing: the confirmation is ' + (st ? 'not ready (' + short(st.state) + ')' : 'unreachable')); }
  const r = await postApi('confirm').catch(() => null);
  const j = r && r.ok ? await r.json().catch(() => null) : null;
  if (!j || j.ok !== true) { if (stage === 'pressing') stage = 'unlocked'; return toast('Not accepted: ' + await errText(r)); }
  if (stage !== 'pressing') return;   // an SSE state event (aborted/failed) may have ended the session meanwhile
  stage = 'pressed';
  sfx('press', 0.9); setTimeout(() => sfx('spring', 0.9), 120);
  setTimeout(() => sfx('flyover', 0.9), 400);
  setTimeout(() => sfx('whistle', 0.95), 3200);
  body.classList.add('pressed');
  pcStart();   // the computer on the desk blows up (visual only: the server already accepted the confirm above)
  spring.visible = true; pressAt = performance.now();
  cv.flying = true; cv.vel.set(11 + Math.random() * 3, 32, -2 + Math.random() * 6); cv.spin.set(5 + Math.random() * 4, 2, -9 - Math.random() * 4);
  setTimeout(blast, 7000);
}
function blast() {
  stage = 'blast'; shake = 1; siren(false, 4);
  if (!files.flyover.paused) fadeOutFile('flyover', 2.5);
  if (!files.whistle.paused) fadeOutFile('whistle', 0.6);
  sfx('blast', 1);
  body.classList.add('blast');
  underGlow.color.set(0xffffff); underGlow.intensity = 3000;
  setTimeout(() => { blastDone = true; maybeShowMap(); }, 3400);
  setTimeout(() => { if (!doneEvent) toast('No result was reported. Check the audit log.'); }, 15000);
}

/* ================= loop ================= */
let last = performance.now(), slideT0 = 0, lit = 0, wasAlert = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;

  const s = clamp((now - slideT0) / 1500, 0, 1);
  device.position.x = Math.pow(1 - s, 3) * 38;
  table.position.x = device.position.x; underGlow.position.x = device.position.x;   // the device never slides unsupported

  // key idles with a gentle bob until it is picked up
  if (stage === 'locked' && keyState === 'loose' && !dragging) key.position.y = KEY_HOME.y + 0.06 * Math.sin(t * 2);
  if (keyState === 'inserted' && !dragging && turnRot > 0) { turnRot = Math.max(0, turnRot - dt * 4); key.rotation.y = -turnRot; }   // springs back if released early
  // key-hole light: flashing yellow = waiting for the key, steady green = key is in, steady red = key turned (and everything after)
  {
    let colour, power;
    if (stage === 'locked' && keyState !== 'turned') {
      if (keyState === 'inserted') { colour = 0x00ff30; power = 1.6; }
      else { colour = 0xffc800; power = Math.sin(t * 6) > 0 ? 1.8 : 0.15; }
    } else { colour = 0xff0000; power = 1.6; }
    led.material.emissiveIntensity = power;
    led.material.emissive.set(colour);
  }

  // glass lid follows glassAngle (a short resisting wiggle while still locked); the lock unclicks after unlock
  const wig = (now - glassWiggleAt) / 1000;
  hinge.rotation.x = -glassAngle - (wig < 0.4 ? Math.sin(wig * 60) * 0.025 * (1 - wig / 0.4) : 0);

  const alert = (stage === 'unlocked' || stage === 'pressing' || stage === 'pressed');
  if (alert !== wasAlert) { body.classList.toggle('alert', alert); wasAlert = alert; }
  lit += ((alert ? 1 : 0) - lit) * Math.min(1, dt * 4);
  trefoil.rotation.y -= dt * 5 * lit;
  const flick = 0.9 + 0.1 * Math.sin(t * 17);
  symMat.emissiveIntensity = lit * 5 * flick; symLight.intensity = lit * 55 * flick;
  const phaseL = Math.floor(t / 0.45) % 2 === 0, on = alert ? 1 : 0;
  strobeL.intensity += ((phaseL ? 1800 : 0) * on - strobeL.intensity) * Math.min(1, dt * 30);
  strobeR.intensity += ((phaseL ? 0 : 1800) * on - strobeR.intensity) * Math.min(1, dt * 30);
  if (stage !== 'blast') underGlow.intensity = 220 + 70 * Math.sin(t * 2.6);

  if (keyBreak.moving && keyBreak.piece) {
    const p = keyBreak.piece;
    keyBreak.vel.y -= 60 * dt; p.position.addScaledVector(keyBreak.vel, dt);
    p.rotation.x += keyBreak.spin.x * dt; p.rotation.y += keyBreak.spin.y * dt; p.rotation.z += keyBreak.spin.z * dt;
    const onPlate = Math.abs(p.position.x) <= 9.5 && Math.abs(p.position.z) <= 6;
    const floorY = (onPlate ? PLATE_TOP : surfaceY(p.position.x, p.position.z)) + 0.3;
    if (p.position.y < floorY) {
      p.position.y = floorY; keyBreak.vel.y *= -0.3; keyBreak.vel.x *= 0.55; keyBreak.vel.z *= 0.55; keyBreak.spin.multiplyScalar(0.45);
      if (keyBreak.vel.length() < 1.5) { keyBreak.moving = false; p.rotation.x = Math.PI / 2; p.rotation.z = 0; }   // comes to rest lying down

    cap.rotation.x += cv.spin.x * dt; cap.rotation.y += cv.spin.y * dt; cap.rotation.z += cv.spin.z * dt;
    const capFloor = (cap.position.x > 9.5 ? surfaceY(cap.position.x, cap.position.z) : FLOOR_Y) + 2;   // x<=9.5 is the device itself: only the room floor stops it

/* ================= start ================= */
$('#arm').onclick = () => {
  if (stage !== 'idle' || !info || info.state !== 'armed') return;
  stage = 'locked';
  startAudio(); ctx.resume();
  body.classList.add('armed');
  slideT0 = performance.now();
  for (const a of Object.values(files)) a.load();
  requestAnimationFrame(frame);
};
boot();
window.__nuke = { get stage() { return stage; }, get key() { return keyState; }, get glass() { return glassAngle; }, get info() { return info; }, get done() { return doneEvent; }, get server() { return serverState; } };
</script>
