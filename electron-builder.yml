appId: local.nuke-uninstaller
productName: Nuke-Uninstaller
asar: false
directories:
  output: release
files:
  - app/**
  - lib/**
  - vendor/**
  - sounds/**
  - cleanup.html
  - cleanup-plain.html
  - index.html
  - run.mjs
  - scan.mjs
  - server.mjs
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
win:
  icon: build/icon.png
  target:
    - target: portable
      arch: x64
    - target: nsis
      arch: x64
  requestedExecutionLevel: asInvoker
portable:
  artifactName: Nuke-Uninstaller-Portable.exe
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  license: build/license.txt
  artifactName: Install-Nuke-Uninstaller.exe
