<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuclear Button</title>
<style>
  :root { --red:#d4121a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#1b1b1d; color:#cfcfcf;
    font-family: system-ui, Segoe UI, sans-serif; }
  #app { position:fixed; inset:0; display:flex; align-items:flex-start; justify-content:flex-end; padding:14px 18px; }
  #app p { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); opacity:.35; margin:0; transition:opacity 1s; }
  body.armed #app p { opacity:0; }
  #arm { z-index:5; background:#2a2a2d; color:#e9e9e9; border:1px solid #444; border-radius:8px;
    padding:6px 12px; font-size:14px; cursor:pointer; display:flex; gap:8px; align-items:center; }
  #arm:hover { background:#3a2020; border-color:var(--red); }
  #arm b { color:var(--red); }

  #gl { position:fixed; inset:0; width:100%; height:100%; display:none; z-index:20; touch-action:none; }
  body.armed #gl { display:block; animation: fadein 1s ease forwards; }
  @keyframes fadein { from { opacity:0 } to { opacity:1 } }

  /* darkness with a spotlight hole over the button */
  #dim { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 1.2s ease; z-index:25;
    background: radial-gradient(ellipse 520px 380px at 50% 58%, rgba(0,0,0,0) 0%, rgba(0,0,0,.45) 60%, rgba(0,0,0,.93) 100%); }
  body.armed #dim { opacity:1; }

  /* red alert light spill from the screen edges */
  #beacons { position:fixed; inset:0; pointer-events:none; z-index:26; opacity:0; transition:opacity .5s; mix-blend-mode:screen; }
  body.alert #beacons { opacity:.55; }
  #beacons::before, #beacons::after { content:""; position:absolute; inset:0; }
  #beacons::before { background: radial-gradient(circle at 0% 50%, rgba(255,0,0,.8), transparent 55%); animation: strobeL .9s steps(1) infinite; }
  #beacons::after { background: radial-gradient(circle at 100% 50%, rgba(255,0,0,.8), transparent 55%); animation: strobeR .9s steps(1) infinite; }
  @keyframes strobeL { 0%{opacity:1} 50%{opacity:0} }
  @keyframes strobeR { 0%{opacity:0} 50%{opacity:1} }

  #hint { position:fixed; left:50%; bottom:5%; transform:translateX(-50%); z-index:30; pointer-events:none; display:none;
    font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:#ff9a9a; text-shadow:0 0 8px #f00; }
  body.armed #hint { display:block; }
  body.pressed #hint { display:none; }

  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:50; }
  body.blast #flash { animation: flash 3.2s ease-out forwards; }
  @keyframes flash { 0%{opacity:1} 12%{opacity:1} 100%{opacity:0} }
  #after { position:fixed; inset:0; z-index:60; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(0,0,0,.88); text-align:center; padding:24px; }
  body.done #after { display:flex; }
  #after h1 { margin:0; font-size:48px; letter-spacing:.2em; color:var(--red); text-shadow:0 0 20px #f00; }
  #after code { background:#222; padding:4px 10px; border-radius:6px; color:#ffd04a; font-size:20px; }
  #after button { background:#2a2a2d; color:#eee; border:1px solid #555; border-radius:8px; padding:8px 16px; cursor:pointer; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <button id="arm" title="Arm the nuclear button"><b>&#9762;</b> Nuclear button</button>
  <p>(a normal, calm app lives here)</p>
</div>
<canvas id="gl"></canvas>
<div id="dim"></div>
<div id="beacons"></div>
<div id="hint">Drag the glass cover up</div>
<div id="flash"></div>
<div id="after">
  <h1>DETONATED</h1>
  <p>Go back to Claude and run <code>/nuke</code>. <span id="note"></span></p>
  <button id="copy">Copy /nuke again</button>
  <button id="reset">Reset</button>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = s => document.querySelector(s);
const body = document.body;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ================= sound ================= */
let ctx, sirenGain, sirenOn = false;
function startAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator(); osc.type = 'sawtooth';
  const lfo = ctx.createOscillator(); lfo.type = 'triangle'; lfo.frequency.value = 0.28;
  const depth = ctx.createGain(); depth.gain.value = 260;
  const base = ctx.createConstantSource(); base.offset.value = 620;
  lfo.connect(depth); depth.connect(osc.frequency); base.connect(osc.frequency);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
  sirenGain = ctx.createGain(); sirenGain.gain.value = 0;
  osc.connect(lp); lp.connect(sirenGain); sirenGain.connect(ctx.destination);
  osc.start(); lfo.start(); base.start();
}
function synthSiren(on, sec) {
  if (!ctx) return;
  const g = sirenGain.gain, t = ctx.currentTime;
  g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
  g.linearRampToValueAtTime(on ? 0.22 : 0, t + sec);
}
function synthClick() {
  if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
  o.type = 'square'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + .12);
  g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t + .15);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + .16);
}
function synthBlast() {
  if (!ctx) return;
  const t = ctx.currentTime, len = ctx.sampleRate * 6;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random()*2 - 1;
  const n = ctx.createBufferSource(); n.buffer = buf;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(5000, t); lp.frequency.exponentialRampToValueAtTime(90, t + 5);
  const ng = ctx.createGain(); ng.gain.setValueAtTime(1, t); ng.gain.exponentialRampToValueAtTime(.001, t + 5.5);
  n.connect(lp); lp.connect(ng); ng.connect(ctx.destination); n.start(t);
  const sub = ctx.createOscillator(); sub.type = 'sine';
  sub.frequency.setValueAtTime(70, t); sub.frequency.exponentialRampToValueAtTime(22, t + 4);
  const sg = ctx.createGain(); sg.gain.setValueAtTime(1.2, t); sg.gain.exponentialRampToValueAtTime(.001, t + 5);
  sub.connect(sg); sg.connect(ctx.destination); sub.start(t); sub.stop(t + 5.2);
}

// real recordings in sounds/*.mp3; the synth above stands in for any that are missing
const files = {};
for (const n of ['siren', 'blast', 'spring', 'glass', 'press', 'flyover', 'whistle']) {
  const a = new Audio('sounds/' + n + '.mp3'); a.preload = 'auto'; a.dataset.ok = '1';
  a.addEventListener('error', () => { a.dataset.ok = '0'; });
  files[n] = a;
}
files.siren.loop = true; files.siren.volume = 0;
const hasFile = n => files[n].dataset.ok === '1';
function sfx(n, vol = 1) {
  if (hasFile(n)) {
    const a = files[n]; a.currentTime = 0; a.volume = vol;
    a.play().catch(() => { a.dataset.ok = '0'; sfx(n, vol); });
  } else if (n === 'blast') synthBlast();
  else if (n !== 'flyover' && n !== 'whistle') synthClick();
}
function fadeOutFile(n, sec) {
  const a = files[n], from = a.volume, steps = 20; let i = 0;
  const t = setInterval(() => { i++; a.volume = clamp(from * (1 - i / steps), 0, 1); if (i >= steps) { clearInterval(t); a.pause(); } }, sec * 1000 / steps);
}
let fadeTimer;
function siren(on, sec) {
  if (on === sirenOn) return;
  sirenOn = on;
  if (!hasFile('siren')) return synthSiren(on, sec);
  const a = files.siren, target = on ? 0.75 : 0, steps = 30, dt = sec * 1000 / steps, from = a.volume;
  clearInterval(fadeTimer);
  if (on && a.paused) a.play().catch(() => { a.dataset.ok = '0'; synthSiren(on, sec); });
  let i = 0;
  fadeTimer = setInterval(() => {
    i++; a.volume = clamp(from + (target - from) * i / steps, 0, 1);
    if (i >= steps) { clearInterval(fadeTimer); if (!on) a.pause(); }
  }, dt);
}

/* ================= 3D scene ================= */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040404);
const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
const CAM0 = new THREE.Vector3(0, 11.5, 18), LOOK = new THREE.Vector3(0, 3.2, 0);

const M = (Cls, o) => new Cls({ envMap: envTex, ...o });
const metalDark = M(THREE.MeshStandardMaterial, { color: 0x2c2e33, metalness: 0.9, roughness: 0.38, envMapIntensity: 0.7 });
const plateBlack = M(THREE.MeshPhysicalMaterial, { color: 0x09090b, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.18, envMapIntensity: 0.6 });
const chrome = M(THREE.MeshStandardMaterial, { color: 0xdfe2e7, metalness: 1, roughness: 0.13, envMapIntensity: 1.1 });
const redMat = M(THREE.MeshPhysicalMaterial, { color: 0xb00810, roughness: 0.34, clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 0.45 });
const floorMat = M(THREE.MeshStandardMaterial, { color: 0x0d0d0f, roughness: 0.32, metalness: 0.25, envMapIntensity: 0.25 });
const glassMat = M(THREE.MeshPhysicalMaterial, {
  color: 0xffffff, transmission: 1, thickness: 0.15, roughness: 0.02, ior: 1.45, metalness: 0,
  attenuationColor: new THREE.Color(0xdcecff), attenuationDistance: 30, envMapIntensity: 0.15, specularIntensity: 0.35, side: THREE.DoubleSide
});

// hazard stripes
function hazardTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'); g.fillStyle = '#0c0c0c'; g.fillRect(0, 0, 512, 512);
  g.fillStyle = '#f2b300'; g.translate(256, 256); g.rotate(Math.PI / 4);
  for (let i = -20; i < 20; i++) g.fillRect(-512, i * 44, 1024, 22);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

const device = new THREE.Group(); scene.add(device);

const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 64), floorMat);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const BASE_Y = 1.6, PLATE_TOP = 3.1;
const base = new THREE.Mesh(new RoundedBoxGeometry(18, 2, 12, 6, 0.45), metalDark);
base.position.y = BASE_Y; base.castShadow = base.receiveShadow = true; device.add(base);
for (const [x, z] of [[-7.5, -4.5], [7.5, -4.5], [-7.5, 4.5], [7.5, 4.5]]) {
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 0.6, 24), metalDark);
  foot.position.set(x, 0.3, z); device.add(foot);
}
const plate = new THREE.Mesh(new RoundedBoxGeometry(15, 0.5, 9.6, 5, 0.18), plateBlack);
plate.position.y = 2.85; plate.castShadow = plate.receiveShadow = true; device.add(plate);

const hazard = new THREE.Mesh(new THREE.CircleGeometry(4.7, 80),
  new THREE.MeshStandardMaterial({ map: hazardTexture(), roughness: 0.5, metalness: 0.1, envMap: envTex, envMapIntensity: 0.4 }));
hazard.rotation.x = -Math.PI / 2; hazard.position.y = PLATE_TOP + 0.01; hazard.receiveShadow = true; device.add(hazard);

const bezel = new THREE.Mesh(new THREE.TorusGeometry(3.95, 0.2, 24, 120), chrome);
bezel.rotation.x = Math.PI / 2; bezel.position.y = PLATE_TOP + 0.12; bezel.castShadow = true; device.add(bezel);

const symDisc = new THREE.Mesh(new THREE.CircleGeometry(3.85, 80), plateBlack);
symDisc.rotation.x = -Math.PI / 2; symDisc.position.y = PLATE_TOP + 0.04; device.add(symDisc);

// radiation trefoil that lights up and spins
const symMat = new THREE.MeshStandardMaterial({ color: 0x4a3800, emissive: 0xffc000, emissiveIntensity: 0, roughness: 0.5 });
const trefoil = new THREE.Group(); trefoil.position.y = PLATE_TOP + 0.08; device.add(trefoil);
{
  const shape = new THREE.Shape();
  for (const c of [-90, 30, 150]) {
    const a0 = (c - 30) * Math.PI / 180, a1 = (c + 30) * Math.PI / 180;
    shape.moveTo(Math.cos(a0) * 3.55, Math.sin(a0) * 3.55);
    shape.absarc(0, 0, 3.55, a0, a1, false);
    shape.lineTo(Math.cos(a1) * 1.7, Math.sin(a1) * 1.7);
    shape.absarc(0, 0, 1.7, a1, a0, true);
  }
  const blades = new THREE.Mesh(new THREE.ShapeGeometry(shape, 24), symMat);
  const hub = new THREE.Mesh(new THREE.CircleGeometry(0.95, 40), symMat);
  blades.rotation.x = hub.rotation.x = -Math.PI / 2;
  trefoil.add(blades, hub);
}

// chrome sleeve, spring, red mushroom cap
const SLEEVE_TOP = PLATE_TOP + 1.05;
const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(1.75, 1.95, 0.95, 48), chrome);
sleeve.position.y = PLATE_TOP + 0.55; sleeve.castShadow = true; device.add(sleeve);

class Helix extends THREE.Curve {
  getPoint(t, out = new THREE.Vector3()) {
    const a = t * Math.PI * 2 * 7;
    return out.set(Math.cos(a) * 0.62, t, Math.sin(a) * 0.62);
  }
}
const spring = new THREE.Mesh(new THREE.TubeGeometry(new Helix(), 300, 0.1, 10), chrome);
spring.position.y = SLEEVE_TOP - 0.2; spring.scale.y = 0.05; spring.visible = false; spring.castShadow = true; device.add(spring);

const cap = new THREE.Group(); cap.position.y = SLEEVE_TOP; device.add(cap);
{
  const pts = [[0, 0], [1.72, 0], [1.98, 0.28], [2.02, 0.7], [1.86, 1.15], [1.45, 1.55], [0.85, 1.82], [0, 1.9]]
    .map(([x, y]) => new THREE.Vector2(x, y));
  const dome = new THREE.Mesh(new THREE.LatheGeometry(pts, 64), redMat);
  dome.castShadow = true; cap.add(dome);
}
const capHome = cap.position.clone();

// glass cover on a back hinge
const hinge = new THREE.Group(); hinge.position.set(0, PLATE_TOP, -4.6); device.add(hinge);
const glassParts = [];
{
  const W = 9, D = 9.2, H = 5.4, T = 0.16;
  const panel = (w, h, d, x, y, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glassMat); m.position.set(x, y, z);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),
      new THREE.LineBasicMaterial({ color: 0xbfe0ff, transparent: true, opacity: 0.55 }));
    m.add(edges); hinge.add(m); glassParts.push(m);
  };
  panel(W, T, D, 0, H, D / 2);              // top
  panel(W, H, T, 0, H / 2, D);              // front
  panel(T, H, D, -W / 2, H / 2, D / 2);     // left
  panel(T, H, D, W / 2, H / 2, D / 2);      // right
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, W + 0.6, 24), chrome);
  barrel.rotation.z = Math.PI / 2; barrel.position.set(0, 0.1, 0); hinge.add(barrel);
}

// lights
scene.add(new THREE.HemisphereLight(0x303048, 0x050505, 0.35));
const spot = new THREE.SpotLight(0xffffff, 1500, 70, 0.42, 0.75, 1.5);
spot.position.set(0, 26, 9); spot.target.position.set(0, 2, 0);
spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.bias = -0.0004;
scene.add(spot, spot.target);
const underGlow = new THREE.PointLight(0xff1208, 260, 45, 1.6); underGlow.position.set(0, 0.25, 0); scene.add(underGlow);
const strobeL = new THREE.PointLight(0xff0000, 0, 90, 1.5); strobeL.position.set(-16, 7, 6); scene.add(strobeL);
const strobeR = new THREE.PointLight(0xff0000, 0, 90, 1.5); strobeR.position.set(16, 7, 6); scene.add(strobeR);
const symLight = new THREE.PointLight(0xffb000, 0, 22, 1.8); symLight.position.set(0, PLATE_TOP + 2.2, 0); scene.add(symLight);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w / h < 1.4 ? 38 * 1.4 / (w / h) * 0.8 : 38;   // keep the device in frame on narrow windows
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ================= interaction ================= */
let phase = 'idle';                 // idle -> ready -> pressed -> blast
let glassAngle = 0, glassTarget = 0, drag = null;   // degrees, 0 closed .. 110 open
const OPEN = 110;
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pick(e, objs) {
  const r = canvas.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(objs, true)[0];
}
const isOpen = () => glassAngle > 80;
const hitGlass = e => pick(e, glassParts);
const hitCap = e => pick(e, [cap]);

canvas.addEventListener('pointerdown', e => {
  if (phase !== 'ready') return;
  if (hitCap(e) && isOpen()) return press();
  if (hitGlass(e)) {
    drag = { y0: e.clientY, a0: glassAngle, moved: false };
    canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing';
  }
});
canvas.addEventListener('pointermove', e => {
  if (phase !== 'ready') return;
  if (drag) {
    const dy = e.clientY - drag.y0;
    if (Math.abs(dy) > 4) drag.moved = true;
    glassAngle = glassTarget = clamp(drag.a0 - dy * 0.45, 0, OPEN);
    return;
  }
  const overCap = isOpen() && !!hitCap(e);
  canvas.style.cursor = overCap ? 'pointer' : hitGlass(e) ? 'grab' : 'default';
});
function release() {
  if (!drag) return;
  const wasClick = !drag.moved;
  glassTarget = wasClick ? (glassAngle > 55 ? 0 : OPEN) : (glassAngle > 50 ? OPEN : 0);
  drag = null; canvas.style.cursor = 'default';
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

/* ================= press, blast ================= */
const cv = { vel: new THREE.Vector3(), spin: new THREE.Vector3(), flying: false };
let pressAt = 0, shake = 0;
function press() {
  phase = 'pressed';
  sfx('press', 0.9);                       // the siren keeps wailing until the blast
  setTimeout(() => sfx('spring', 0.9), 120);
  setTimeout(() => sfx('flyover', 0.9), 400);
  setTimeout(() => sfx('whistle', 0.95), 3200);
  body.classList.add('pressed');
  spring.visible = true; pressAt = performance.now();
  cv.flying = true;
  cv.vel.set(11 + Math.random() * 3, 32, -2 + Math.random() * 6);
  cv.spin.set(5 + Math.random() * 4, 2, -9 - Math.random() * 4);
  setTimeout(blast, 7000);
}
function blast() {
  phase = 'blast'; shake = 1;
  siren(false, 4);
  if (!files.flyover.paused) fadeOutFile('flyover', 2.5);
  if (!files.whistle.paused) fadeOutFile('whistle', 0.6);
  sfx('blast', 1);
  body.classList.add('blast');
  underGlow.color.set(0xffffff); underGlow.intensity = 3000;
  setTimeout(() => { body.classList.add('done'); copyCmd(); }, 3400);
}

/* ================= loop ================= */
let last = performance.now(), slideT0 = 0, lit = 0, wasAlert = false, wasOpenSnd = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;

  // slide in from the right
  const s = clamp((now - slideT0) / 1500, 0, 1);
  device.position.x = (1 - (1 - Math.pow(1 - s, 3))) * 38;

  // glass settles toward its target when not being dragged
  if (!drag) {
    const was = glassAngle;
    glassAngle += (glassTarget - glassAngle) * Math.min(1, dt * (glassTarget > glassAngle ? 7 : 11));
    if (Math.abs(glassTarget - glassAngle) < 0.15) glassAngle = glassTarget;
    if (was !== glassAngle && glassAngle === glassTarget && phase === 'ready') sfx('glass', glassTarget ? 0.7 : 0.9);
  }
  hinge.rotation.x = -glassAngle * Math.PI / 180;

  // alert state follows the cover
  const alert = glassAngle > 25 && phase !== 'blast';
  if (alert !== wasAlert) {
    body.classList.toggle('alert', alert); wasAlert = alert;
    if (phase === 'ready') siren(alert, alert ? 1.4 : 1.0);
  }
  const target = glassAngle > 25 ? clamp((glassAngle - 25) / 55, 0, 1) : 0;
  lit += (target - lit) * Math.min(1, dt * 4);
  trefoil.rotation.y -= dt * 5 * lit;
  const flick = 0.9 + 0.1 * Math.sin(t * 17);
  symMat.emissiveIntensity = lit * 5 * flick;
  symLight.intensity = lit * 55 * flick;
  const phaseL = Math.floor(t / 0.45) % 2 === 0;
  const on = alert ? 1 : 0;
  strobeL.intensity += ((phaseL ? 1800 : 0) * on - strobeL.intensity) * Math.min(1, dt * 30);
  strobeR.intensity += ((phaseL ? 0 : 1800) * on - strobeR.intensity) * Math.min(1, dt * 30);
  if (phase !== 'blast') underGlow.intensity = 220 + 70 * Math.sin(t * 2.6);

  // cap flies off, spring boings
  if (cv.flying) {
    cv.vel.y -= 60 * dt;
    cap.position.addScaledVector(cv.vel, dt);
    cap.rotation.x += cv.spin.x * dt; cap.rotation.y += cv.spin.y * dt; cap.rotation.z += cv.spin.z * dt;
    if (cap.position.y < 2 && cap.position.x > 9.5) {
      cap.position.y = 2; cv.vel.y *= -0.3; cv.vel.x *= 0.6; cv.spin.multiplyScalar(0.5);
      if (cv.vel.length() < 1.5) cv.flying = false;
    }
    if (cap.position.x > 40) cv.flying = false;
  }
  if (spring.visible) {
    const u = (now - pressAt) / 1000;
    const y = 1.6 * (1 - Math.exp(-9 * u) * Math.cos(26 * u)) + 0.15 * Math.exp(-1.5 * u) * Math.sin(14 * u);
    spring.scale.y = Math.max(0.05, y);
  }

  // camera: slow push-in while the countdown runs, shake on the blast
  const pushT = phase === 'pressed' ? clamp((now - pressAt) / 7000, 0, 1) : phase === 'blast' ? 1 : 0;
  camera.position.set(CAM0.x, CAM0.y - pushT * 2.2, CAM0.z - pushT * 5);
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 0.35);
    camera.position.x += (Math.random() - 0.5) * shake * 1.4;
    camera.position.y += (Math.random() - 0.5) * shake * 1.4;
  }
  camera.lookAt(LOOK);
  renderer.render(scene, camera);
}

/* ================= start / reset ================= */
$('#arm').onclick = () => {
  if (phase !== 'idle') return;
  phase = 'ready';
  startAudio(); ctx.resume();
  body.classList.add('armed');
  slideT0 = performance.now();
  for (const a of Object.values(files)) a.load();
  requestAnimationFrame(frame);
  setInterval(() => {                 // hint text follows the state
    if (phase !== 'ready') return;
    $('#hint').textContent = isOpen() ? 'Press the red button' : 'Drag the glass cover up';
  }, 200);
};
async function copyCmd() {
  let ok = false;
  try { await navigator.clipboard.writeText('/nuke'); ok = true; } catch (e) {}
  if (!ok) {
    try { const t = document.createElement('textarea'); t.value = '/nuke'; document.body.appendChild(t);
      t.select(); ok = document.execCommand('copy'); t.remove(); } catch (e) {}
  }
  $('#note').textContent = ok ? 'It is on your clipboard.' : 'Type it yourself (copy failed).';
}
$('#copy').onclick = copyCmd;
$('#reset').onclick = () => location.reload();
window.__nuke = { files, get phase() { return phase; }, get glass() { return glassAngle; }, press, camera };
</script>
