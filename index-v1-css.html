<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuclear Button</title>
<style>
  :root { --red:#d4121a; --amber:#ffb400; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#1b1b1d; color:#cfcfcf;
    font-family: system-ui, Segoe UI, sans-serif; }
  #app { position:fixed; inset:0; display:flex; align-items:flex-start; justify-content:flex-end; padding:14px 18px; }
  body.armed #app p { opacity:0; } #app p { transition:opacity 1s; position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); opacity:.35; margin:0; }

  /* the small button up top that arms everything */
  #arm { z-index:5; background:#2a2a2d; color:#e9e9e9; border:1px solid #444; border-radius:8px;
    padding:6px 12px; font-size:14px; cursor:pointer; display:flex; gap:8px; align-items:center; }
  #arm:hover { background:#3a2020; border-color:var(--red); }
  #arm b { color:var(--red); }

  /* darkness + spotlight */
  #dim { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 1.2s ease; z-index:10;
    background: radial-gradient(ellipse 330px 280px at 50% 58%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 60%, rgba(0,0,0,.97) 100%); }
  body.armed #dim { opacity:1; }
  body.armed #app { pointer-events:none; }
  #stage { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; }
  body.armed #stage { display:flex; }

  /* red glow underneath */
  #glow { position:absolute; left:50%; top:63%; width:640px; height:220px; transform:translate(-50%,0);
    background: radial-gradient(ellipse at 50% 20%, rgba(255,20,20,.75), rgba(255,0,0,0) 70%);
    filter: blur(14px); animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.55; } }

  /* alert beacons */
  #beacons { position:fixed; inset:0; pointer-events:none; z-index:15; opacity:0; }
  body.alert #beacons { opacity:1; }
  #beacons::before, #beacons::after { content:""; position:absolute; inset:0; }
  #beacons::before { background: radial-gradient(circle at 0% 50%, rgba(255,0,0,.75), transparent 55%);
    animation: strobeL .9s steps(1) infinite; }
  #beacons::after { background: radial-gradient(circle at 100% 50%, rgba(255,0,0,.75), transparent 55%);
    animation: strobeR .9s steps(1) infinite; }
  @keyframes strobeL { 0%{opacity:1} 50%{opacity:0} }
  @keyframes strobeR { 0%{opacity:0} 50%{opacity:1} }

  /* the device */
  #device { position:relative; width:460px; height:380px; zoom:min(1, calc(100vh / 520)); transform:translateX(120vw);
    transition: transform 1.1s cubic-bezier(.2,.9,.25,1.05); perspective:900px; }
  body.armed #device { transform:translateX(0); }
  #base { position:absolute; left:20px; right:20px; bottom:20px; height:130px; border-radius:10px;
    background:linear-gradient(#5a5d63,#3a3c40); box-shadow:0 20px 40px rgba(0,0,0,.8); }
  #plate { position:absolute; left:44px; right:44px; bottom:84px; height:120px; border-radius:6px;
    background:linear-gradient(#1b1b1b,#0b0b0b); }
  #ring { position:absolute; left:50%; bottom:70px; width:260px; height:96px; margin-left:-130px;
    border-radius:50%; background:radial-gradient(ellipse, #3b3b3b 40%, #8a8f96 70%, #444 100%); }
  svg#trefoil { position:absolute; left:50%; bottom:64px; width:120px; height:120px; margin-left:-60px;
    transform:scaleY(.42); transform-origin:50% 50%; }
  #trefoil .blades { fill:#5a4700; transform-origin:50% 50%; transition:fill .6s; }
  body.lifted #trefoil .blades { fill:var(--amber); filter:drop-shadow(0 0 7px #ffb400);
    animation: spin 2.2s linear infinite, flick 1.1s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes flick { 50% { filter:drop-shadow(0 0 16px #ffd000); } }

  /* red cap + spring */
  #spring { position:absolute; left:50%; bottom:128px; width:46px; height:70px; margin-left:-23px; opacity:0;
    transform-origin:50% 100%; transform:scaleY(.1); }
  #cap { position:absolute; left:50%; bottom:140px; width:150px; height:96px; margin-left:-75px; cursor:pointer;
    transition: transform .25s; transform-origin:50% 100%; }
  #cap .top { position:absolute; left:0; right:0; top:0; height:70px; border-radius:50% 50% 38% 38% / 70% 70% 30% 30%;
    background:radial-gradient(ellipse at 38% 28%, #ff6a6a, #d4121a 45%, #7d0509 100%); box-shadow:0 10px 18px rgba(0,0,0,.6); }
  #cap .stem { position:absolute; left:18px; right:18px; bottom:0; height:34px; border-radius:6px 6px 40% 40%/6px 6px 30% 30%;
    background:linear-gradient(#a30c12,#5a0509); }
  body.lifted #cap:hover { transform:translateY(-3px); }
  body.pressed #cap { cursor:default; animation: popoff 1.1s cubic-bezier(.2,.6,.3,1) forwards; }
  @keyframes popoff {
    0%   { transform:translateY(0) rotate(0); opacity:1; }
    30%  { transform:translateY(-230px) rotate(-28deg); }
    62%  { transform:translateY(-120px) translateX(190px) rotate(120deg); }
    100% { transform:translateY(240px) translateX(330px) rotate(260deg); opacity:0; }
  }
  body.pressed #spring { opacity:1; animation: boing 1.2s ease-out forwards; }
  @keyframes boing {
    0%{transform:scaleY(.1)} 25%{transform:scaleY(1.9)} 45%{transform:scaleY(.7)}
    62%{transform:scaleY(1.3)} 80%{transform:scaleY(.9)} 100%{transform:scaleY(1)}
  }

  /* glass cover, hinged at the back (top edge) */
  #glass { position:absolute; left:50%; bottom:128px; width:250px; height:150px; margin-left:-125px; cursor:pointer;
    transform-origin:50% 0%; transform:translateY(-150px) rotateX(0deg);
    transition: transform 1s cubic-bezier(.3,.7,.2,1);
    border:2px solid rgba(190,220,255,.7); border-radius:10px 10px 20px 20px;
    background:linear-gradient(135deg, rgba(180,210,255,.22), rgba(255,255,255,.06) 40%, rgba(180,210,255,.18));
    box-shadow:inset 0 0 18px rgba(255,255,255,.18); }
  body.lifted #glass { transform:translateY(-150px) rotateX(-115deg); cursor:default; pointer-events:none; }
  #hint { position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); font-size:13px; letter-spacing:.14em;
    text-transform:uppercase; color:#ff8a8a; text-shadow:0 0 8px #f00; white-space:nowrap; }
  body.pressed #hint, body.lifted #hint.hide { display:none; }

  /* flash + aftermath */
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:50; }
  body.blast #flash { animation: flash 3.2s ease-out forwards; }
  @keyframes flash { 0%{opacity:1} 12%{opacity:1} 100%{opacity:0} }
  body.blast #device { animation: shake .09s linear 28; }
  @keyframes shake { 0%{translate:-9px 5px} 25%{translate:8px -6px} 50%{translate:-6px -7px} 75%{translate:7px 6px} 100%{translate:-9px 5px} }
  #after { position:fixed; inset:0; z-index:60; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(0,0,0,.88); text-align:center; padding:24px; }
  body.done #after { display:flex; }
  #after h1 { margin:0; font-size:48px; letter-spacing:.2em; color:var(--red); text-shadow:0 0 20px #f00; }
  #after code { background:#222; padding:4px 10px; border-radius:6px; color:#ffd04a; font-size:20px; }
  #after button { background:#2a2a2d; color:#eee; border:1px solid #555; border-radius:8px; padding:8px 16px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <button id="arm" title="Arm the nuclear button"><b>&#9762;</b> Nuclear button</button>
  <p>(a normal, calm app lives here)</p>
</div>

<div id="beacons"></div>
<div id="dim"></div>

<div id="stage">
  <div id="glow"></div>
  <div id="device">
    <div id="base"></div>
    <div id="plate"></div>
    <div id="ring"></div>
    <svg id="trefoil" viewBox="-50 -50 100 100"><g class="blades" id="blades"></g></svg>
    <svg id="spring" viewBox="0 0 46 70"><path d="M23 70 L5 62 L41 54 L5 46 L41 38 L5 30 L41 22 L5 14 L23 6"
      fill="none" stroke="#c9ccd2" stroke-width="4" stroke-linejoin="round"/></svg>
    <div id="cap"><div class="stem"></div><div class="top"></div></div>
    <div id="glass" title="Lift the cover"></div>
    <div id="hint">Click the glass</div>
  </div>
</div>

<div id="flash"></div>
<div id="after">
  <h1>DETONATED</h1>
  <p>Go back to Claude and run <code>/nuke</code>. <span id="note"></span></p>
  <button id="copy">Copy /nuke again</button>
  <button id="reset">Reset</button>
</div>

<script>
const $ = s => document.querySelector(s);
const body = document.body;

// radiation trefoil: three 60-degree blades around a centre disc
(function(){
  const pt = (r, deg) => [r*Math.cos(deg*Math.PI/180), r*Math.sin(deg*Math.PI/180)];
  let d = '';
  for (const c of [-90, 30, 150]) {
    const a0 = c-30, a1 = c+30, [x0,y0]=pt(46,a0), [x1,y1]=pt(46,a1), [x2,y2]=pt(14,a1), [x3,y3]=pt(14,a0);
    d += `M${x0} ${y0}A46 46 0 0 1 ${x1} ${y1}L${x2} ${y2}A14 14 0 0 0 ${x3} ${y3}Z`;
  }
  const g = $('#blades');
  g.innerHTML = `<path d="${d}"/><circle r="9"/>`;
})();

// ---- audio (synthesised, no files) ----
let ctx, sirenGain, sirenOn = false;
function startAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator(); osc.type = 'sawtooth';
  const lfo = ctx.createOscillator(); lfo.type = 'triangle'; lfo.frequency.value = 0.28;
  const depth = ctx.createGain(); depth.gain.value = 260;
  const base = ctx.createConstantSource(); base.offset.value = 620;
  lfo.connect(depth); depth.connect(osc.frequency); base.connect(osc.frequency);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
  sirenGain = ctx.createGain(); sirenGain.gain.value = 0;
  osc.connect(lp); lp.connect(sirenGain); sirenGain.connect(ctx.destination);
  osc.start(); lfo.start(); base.start();
}
function siren(on, sec) {
  if (on === sirenOn) return;
  if (ok("siren")) { sirenOn = on; fileSiren(on, sec); return; }
  if (!ctx) return;
  sirenOn = on;
  const g = sirenGain.gain, t = ctx.currentTime;
  g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
  g.linearRampToValueAtTime(on ? 0.22 : 0, t + sec);
}
function click() {
  if (ok("clunk")) { playFile("clunk", .9); return; }
  if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
  o.type = 'square'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + .12);
  g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.001, t + .15);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + .16);
}
function blastSound() {
  if (ok("blast")) { playFile("blast", 1); return; }
  if (!ctx) return;
  const t = ctx.currentTime, len = ctx.sampleRate * 6;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random()*2 - 1;
  const n = ctx.createBufferSource(); n.buffer = buf;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(5000, t); lp.frequency.exponentialRampToValueAtTime(90, t + 5);
  const ng = ctx.createGain(); ng.gain.setValueAtTime(1.0, t); ng.gain.exponentialRampToValueAtTime(.001, t + 5.5);
  n.connect(lp); lp.connect(ng); ng.connect(ctx.destination); n.start(t);
  const sub = ctx.createOscillator(); sub.type = 'sine';
  sub.frequency.setValueAtTime(70, t); sub.frequency.exponentialRampToValueAtTime(22, t + 4);
  const sg = ctx.createGain(); sg.gain.setValueAtTime(1.2, t); sg.gain.exponentialRampToValueAtTime(.001, t + 5);
  sub.connect(sg); sg.connect(ctx.destination); sub.start(t); sub.stop(t + 5.2);
}

// ---- real sound files (Mixkit, free licence); synth above is the fallback ----
const files = {};
for (const n of ["siren","blast","spring","clunk"]) {
  const a = new Audio("sounds/" + n + ".mp3"); a.preload = "auto"; a.dataset.ok = "1";
  a.addEventListener("error", () => { a.dataset.ok = "0"; });
  files[n] = a;
}
files.siren.loop = true; files.siren.volume = 0;
const ok = n => files[n].dataset.ok === "1";
function playFile(n, vol = 1) {
  const a = files[n]; a.currentTime = 0; a.volume = vol;
  a.play().catch(() => { a.dataset.ok = "0"; });
}
let fadeTimer;
function fileSiren(on, sec) {
  const a = files.siren, target = on ? 0.7 : 0, steps = 30, dt = sec * 1000 / steps;
  clearInterval(fadeTimer);
  if (on && a.paused) a.play().catch(() => { a.dataset.ok = "0"; });
  const from = a.volume; let i = 0;
  fadeTimer = setInterval(() => {
    i++; a.volume = Math.max(0, Math.min(1, from + (target - from) * i / steps));
    if (i >= steps) { clearInterval(fadeTimer); if (!on) a.pause(); }
  }, dt);
}

// ---- flow ----
const state = { phase: 'idle' };           // idle -> armed -> lifted -> pressed -> blast
$('#arm').onclick = () => {
  if (state.phase !== 'idle') return;
  state.phase = 'armed';
  startAudio(); ctx.resume();
  body.classList.add('armed');
};
$('#glass').onclick = () => {
  if (state.phase !== 'armed') return;
  state.phase = 'lifted';
  click();
  body.classList.add('lifted', 'alert');
  $('#hint').textContent = 'Press it';
};
const cap = $('#cap');
cap.addEventListener('pointerenter', () => { if (state.phase === 'lifted') siren(true, 1.6); });
cap.addEventListener('pointerleave', () => { if (state.phase === 'lifted') siren(false, 1.2); });
cap.onclick = () => {
  if (state.phase !== 'lifted') return;
  state.phase = 'pressed';
  click(); siren(false, .6);
  if (ok("spring")) setTimeout(() => playFile("spring", .9), 250);
  body.classList.add('pressed');
  setTimeout(() => {                         // ~7 seconds after the press
    state.phase = 'blast';
    blastSound();
    body.classList.add('blast');
    setTimeout(() => { body.classList.add('done'); copyCmd(); }, 3400);
  }, 7000);
};
async function copyCmd() {
  let ok = false;
  try { await navigator.clipboard.writeText('/nuke'); ok = true; } catch (e) {}
  if (!ok) {
    try { const t = document.createElement('textarea'); t.value = '/nuke'; document.body.appendChild(t);
      t.select(); ok = document.execCommand('copy'); t.remove(); } catch (e) {}
  }
  $('#note').textContent = ok ? 'It is on your clipboard.' : 'Type it yourself (copy failed).';
}
$('#copy').onclick = copyCmd;
$('#reset').onclick = () => location.reload();
</script>
</body>
</html>
